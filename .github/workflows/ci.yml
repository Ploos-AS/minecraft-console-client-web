name: CI

on:
  push:
    branches:
      - main
      - 'work/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true
      - name: Download modules
        run: go mod download
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build web
        run: go build ./cmd/mcc-web
      - name: Build qualifier
        run: go build ./cmd/mcc-qualify
      - name: Packaging checks
        env:
          MCC_WS_PASSWORD: test-only
          MCC_WEB_PASSWORD: web-test-only
        run: |
          docker compose config >/dev/null
          grep -F 'ghcr.io/ploos-as/minecraft-console-client-web:0.1.0' compose.yaml
          grep -F 'Image=ghcr.io/ploos-as/minecraft-console-client-web:0.1.0' quadlet/minecraft-console-client-web.container
      - name: Docker build
        run: docker build -t minecraft-console-client-web:test .
      - name: Container smoke test
        run: |
          docker run -d --name mcc-web-test \
            -e MCC_WS_PASSWORD=test-only \
            -e MCC_WEB_PASSWORD=web-test-only \
            -p 127.0.0.1:18080:8080 \
            minecraft-console-client-web:test
          trap 'docker rm -f mcc-web-test >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/api/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/api/healthz >/dev/null
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/status)" = "401"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/)" = "303"
          curl -fsS -c /tmp/mcc-web.cookies \
            -d 'username=admin&password=web-test-only' \
            -o /dev/null \
            http://127.0.0.1:18080/api/login
          curl -fsS -b /tmp/mcc-web.cookies http://127.0.0.1:18080/api/status >/dev/null
